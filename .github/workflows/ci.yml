name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  plugin:
    name: Plugin tests and package check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all plugin tests
        run: pnpm --dir plugins/dsh-llm-grok test
      - name: Check plugin package contents
        working-directory: plugins/dsh-llm-grok
        run: npm pack --dry-run --ignore-scripts

  rust:
    name: Rust checks
    runs-on: macos-14
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-rust-
      - name: Require arm64 runner
        run: test "$RUNNER_ARCH" = ARM64
      - name: Install Rust checks
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.88.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Clippy with all targets and features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod
      - name: Install Rust 1.88.x
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2
      - name: Run RustSec audit
        working-directory: src-tauri
        run: cargo audit

  macos-app-smoke:
    name: Unsigned macOS app smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-app-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-app-
      - name: Require arm64 runner
        run: test "$RUNNER_ARCH" = ARM64
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all bundle unit tests
        run: node --test scripts/prepare-bundle.test.mjs
      - name: Build an unsigned .app smoke artifact
        run: pnpm exec tauri build --target aarch64-apple-darwin --ci --bundles app --no-sign
      - name: Validate the unsigned arm64 .app and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          product_name="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          expected_app_path="$bundle_dir/DeepSeek RS.app"
          app_path="$bundle_dir/${product_name}.app"
          test "$app_path" = "$expected_app_path"
          shopt -s nullglob
          app_paths=("$bundle_dir"/*.app)
          test "${#app_paths[@]}" -eq 1
          test "${app_paths[0]}" = "$app_path"
          test -d "$app_path"

          binary_name="$(awk -F'\"' '/^[[:space:]]*name[[:space:]]*=/{print $2; exit}' src-tauri/Cargo.toml)"
          main_binary="$app_path/Contents/MacOS/$binary_name"
          test -x "$main_binary"
          file -b "$main_binary" | grep -F 'Mach-O'
          test "$(lipo -archs "$main_binary")" = arm64

          expected_version="$(node -p "require('./package.json').version")"
          test "$expected_version" = "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          plist="$app_path/Contents/Info.plist"
          test -s "$plist"
          for plist_key in CFBundleShortVersionString CFBundleVersion; do
            built_version="$(/usr/libexec/PlistBuddy -c "Print :$plist_key" "$plist")"
            test "$built_version" = "$expected_version"
          done

          resources="$app_path/Contents/Resources"
          embedded_node="$resources/dsh/bin/node"
          dsh_bin="$resources/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          test -x "$embedded_node"
          test -s "$dsh_bin"
          expected_dsh_version="$(node -p "require('./package.json').dependencies['@deepseek-ai/dsh']")"
          test "$("$embedded_node" "$dsh_bin" --version)" = "$expected_dsh_version"
          "$embedded_node" "$dsh_bin" --help >/dev/null

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_TRIPLE: aarch64-apple-darwin
  CARGO_BUILD_TARGET: aarch64-apple-darwin
  RUST_TOOLCHAIN: 1.88.0

jobs:
  release:
    name: Verify, sign, notarize, and publish arm64 app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64

      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Require matching release versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk -F'\"' '/^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' src-tauri/Cargo.toml)"
          for value_name in package_version tauri_version cargo_version; do
            if [[ -z "${!value_name:-}" ]]; then
              echo "::error::Could not read ${value_name}"
              exit 1
            fi
          done
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || \
            "$tag_version" != "$package_version" || \
            "$tag_version" != "$tauri_version" || \
            "$tag_version" != "$cargo_version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must equal the package, Tauri, and Cargo versions"
            printf 'tag=%s package=%s tauri=%s cargo=%s\n' \
              "$tag_version" "$package_version" "$tauri_version" "$cargo_version"
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$tag_version" >> "$GITHUB_ENV"

      # These repository or release-environment secrets are required:
      # APPLE_CERTIFICATE (base64 Developer ID Application .p12),
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
      # APPLE_PASSWORD (app-specific password), and APPLE_TEAM_ID.
      - name: Require Apple signing and notarization secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for variable_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required secret ${variable_name}"
              exit 1
            fi
          done

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-release-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all bundle unit tests
        run: node --test scripts/prepare-bundle.test.mjs
      - name: Run Web build gate
        run: pnpm build
      - name: Run all plugin tests
        run: pnpm --dir plugins/dsh-llm-grok test
      - name: Check plugin package contents
        working-directory: plugins/dsh-llm-grok
        run: npm pack --dry-run --ignore-scripts

      - name: Install Rust 1.88.x checks
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Run Clippy with all targets and features
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod
      - name: Install fixed cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2
      - name: Run RustSec audit
        working-directory: src-tauri
        run: cargo audit
      - name: Install fixed cargo-about
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          test "$(cargo about --version)" = "cargo-about 0.9.2"

      - name: Build unsigned arm64 app bundle gate
        run: pnpm exec tauri build --target "$TARGET_TRIPLE" --ci --bundles app --no-sign
      - name: Check app-only arm64 bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/$TARGET_TRIPLE/release/bundle/macos"
          product_name="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          expected_app_path="$bundle_dir/DeepSeek RS.app"
          app_path="$bundle_dir/${product_name}.app"
          test "$app_path" = "$expected_app_path"
          shopt -s nullglob
          app_paths=("$bundle_dir"/*.app)
          test "${#app_paths[@]}" -eq 1
          test "${app_paths[0]}" = "$app_path"
          test -d "$app_path"

          binary_name="$(awk -F'\"' '/^[[:space:]]*name[[:space:]]*=/{print $2; exit}' src-tauri/Cargo.toml)"
          main_binary="$app_path/Contents/MacOS/$binary_name"
          test -x "$main_binary"
          file -b "$main_binary" | grep -F 'Mach-O'
          test "$(lipo -archs "$main_binary")" = arm64

          plist="$app_path/Contents/Info.plist"
          test -s "$plist"
          for plist_key in CFBundleShortVersionString CFBundleVersion; do
            built_version="$(/usr/libexec/PlistBuddy -c "Print :$plist_key" "$plist")"
            test "$built_version" = "$RELEASE_VERSION"
          done

          resources="$app_path/Contents/Resources"
          embedded_node="$resources/dsh/bin/node"
          dsh_bin="$resources/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          test -x "$embedded_node"
          test -s "$dsh_bin"
          expected_dsh_version="$(node -p "require('./package.json').dependencies['@deepseek-ai/dsh']")"
          test "$("$embedded_node" "$dsh_bin" --version)" = "$expected_dsh_version"
          "$embedded_node" "$dsh_bin" --help >/dev/null

          if find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit | grep -q .; then
            echo "::error::This release is app-only; a DMG was generated"
            exit 1
          fi
          app_basename="${app_path##*/}"
          product_name="${app_basename%.app}"
          safe_name="$(printf '%s' "$product_name" | tr -cs '[:alnum:]._-' '-' | sed -e 's/^-*//' -e 's/-*$//')"
          safe_name="${safe_name:-deepseek-rs}"
          artifact_stem="${safe_name}-${RELEASE_VERSION}-${TARGET_TRIPLE}-${RUNNER_ARCH}"
          printf 'APP_PATH=%s\n' "$app_path" >> "$GITHUB_ENV"
          printf 'ARTIFACT_STEM=%s\n' "$artifact_stem" >> "$GITHUB_ENV"

      - name: Add license notices and generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          resources="$APP_PATH/Contents/Resources"
          install -m 0644 LICENSE "$resources/LICENSE"
          install -m 0644 THIRD_PARTY_NOTICES.md "$resources/THIRD_PARTY_NOTICES.md"

          node_license="$resources/dsh/licenses/node/LICENSE"
          dsh_license="$resources/dsh/node_modules/@deepseek-ai/dsh/LICENSE"
          npm_notices="$resources/dsh/licenses/THIRD_PARTY_NOTICES.txt"
          test -s "$resources/LICENSE"
          test -s "$node_license"
          test -s "$dsh_license"
          test -s "$npm_notices"
          grep -F 'Node.js 22.19.0' "$npm_notices"
          grep -F '@deepseek-ai/dsh@' "$npm_notices"

          cargo_about_json="$RUNNER_TEMP/${ARTIFACT_STEM}.cargo-about.json"
          cargo_licenses="$RUNNER_TEMP/${ARTIFACT_STEM}.Cargo-THIRD-PARTY-LICENSES.json"
          cargo_notices="$RUNNER_TEMP/${ARTIFACT_STEM}.Cargo-THIRD-PARTY-NOTICES.txt"
          cargo about generate \
            --format json \
            --fail \
            --frozen \
            --target "$TARGET_TRIPLE" \
            --manifest-path src-tauri/Cargo.toml \
            --config .github/cargo-about.toml \
            > "$cargo_about_json"
          test -s "$cargo_about_json"
          node - "$cargo_about_json" "$cargo_licenses" "$cargo_notices" "$TARGET_TRIPLE" <<'NODE'
          const fs = require("node:fs");

          const [rawPath, licensesPath, noticesPath, target] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(rawPath, "utf8"));
          const crates = report.crates ?? [];
          const licenses = report.licenses ?? [];
          if (crates.length === 0 || licenses.length === 0) {
            throw new Error("cargo-about produced an empty Cargo license report");
          }

          const crateKey = (name, version) => `${name}@${version}`;
          const crateKeys = new Set();
          for (const entry of crates) {
            const packageInfo = entry.package;
            if (!packageInfo?.name || !packageInfo.version || !entry.license?.trim()) {
              throw new Error("cargo-about returned a Cargo crate without license metadata");
            }
            crateKeys.add(crateKey(packageInfo.name, packageInfo.version));
          }

          const referencedCrates = new Set();
          for (const license of licenses) {
            if (!license.id || !license.name || !license.text?.trim() || !license.used_by?.length) {
              throw new Error(`cargo-about returned an incomplete ${license.id ?? "unknown"} license`);
            }
            for (const usedBy of license.used_by) {
              const packageInfo = usedBy.crate;
              if (!packageInfo?.name || !packageInfo.version) {
                throw new Error(`cargo-about returned an invalid user for ${license.id}`);
              }
              const key = crateKey(packageInfo.name, packageInfo.version);
              if (!crateKeys.has(key)) {
                throw new Error(`cargo-about license user is not in the crate inventory: ${key}`);
              }
              referencedCrates.add(key);
            }
          }
          for (const key of crateKeys) {
            if (!referencedCrates.has(key)) {
              throw new Error(`Cargo crate has no collected license text: ${key}`);
            }
          }

          const machineReadable = {
            format: "cargo-about-license-inventory",
            generator: { name: "cargo-about", version: "0.9.2", target },
            crates: crates
              .map(({ package: packageInfo, license }) => ({
                name: packageInfo.name,
                version: packageInfo.version,
                license,
                source: packageInfo.source ?? "path",
                repository: packageInfo.repository ?? null,
              }))
              .sort((left, right) => `${left.name}@${left.version}`.localeCompare(`${right.name}@${right.version}`)),
            licenses: licenses
              .map(({ name, id, text, used_by: usedBy }) => ({
                name,
                id,
                text,
                usedBy: usedBy
                  .map(({ crate: packageInfo }) => ({
                    name: packageInfo.name,
                    version: packageInfo.version,
                  }))
                  .sort((left, right) => `${left.name}@${left.version}`.localeCompare(`${right.name}@${right.version}`)),
              }))
              .sort((left, right) => left.id.localeCompare(right.id) || left.text.localeCompare(right.text)),
          };
          fs.writeFileSync(licensesPath, `${JSON.stringify(machineReadable, null, 2)}\n`);

          const lines = [
            "Cargo Third-Party Licenses and Notices",
            "Generated by cargo-about 0.9.2.",
            `Target: ${target}`,
            `Cargo crates: ${machineReadable.crates.length}`,
            "",
            "Package inventory:",
            ...machineReadable.crates.map((entry) =>
              `- ${entry.name}@${entry.version} | ${entry.license} | ${entry.repository ?? entry.source}`,
            ),
            "",
            "License texts:",
          ];
          for (const license of machineReadable.licenses) {
            lines.push(
              "",
              `## ${license.name} (${license.id})`,
              `Used by: ${license.usedBy.map((entry) => `${entry.name}@${entry.version}`).join(", ")}`,
              "",
              license.text.trim(),
            );
          }
          fs.writeFileSync(noticesPath, `${lines.join("\n")}\n`);
          NODE
          test -s "$cargo_licenses"
          test -s "$cargo_notices"
          install -m 0644 "$cargo_licenses" "$resources/Cargo-THIRD-PARTY-LICENSES.json"
          install -m 0644 "$cargo_notices" "$resources/Cargo-THIRD-PARTY-NOTICES.txt"
          test -s "$resources/Cargo-THIRD-PARTY-LICENSES.json"
          test -s "$resources/Cargo-THIRD-PARTY-NOTICES.txt"
          printf 'CARGO_LICENSES_PATH=%s\n' "$cargo_licenses" >> "$GITHUB_ENV"
          printf 'CARGO_NOTICES_PATH=%s\n' "$cargo_notices" >> "$GITHUB_ENV"

          npm_tree="$RUNNER_TEMP/npm-production-tree.json"
          cargo_metadata="$RUNNER_TEMP/cargo-metadata.json"
          sbom="$RUNNER_TEMP/${ARTIFACT_STEM}.cdx.json"
          pnpm list --prod --json --depth 999 > "$npm_tree"
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > "$cargo_metadata"
          node - "$npm_tree" "$cargo_metadata" "$sbom" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const [npmPath, cargoPath, outputPath] = process.argv.slice(2);
          const npmRoots = JSON.parse(fs.readFileSync(npmPath, "utf8"));
          const cargo = JSON.parse(fs.readFileSync(cargoPath, "utf8"));
          const components = new Map();

          function npmPurlName(name) {
            const scopeSeparator = name.startsWith("@") ? name.indexOf("/") : -1;
            if (scopeSeparator > 1 && scopeSeparator < name.length - 1) {
              return `${encodeURIComponent(name.slice(0, scopeSeparator))}/${encodeURIComponent(name.slice(scopeSeparator + 1))}`;
            }
            return encodeURIComponent(name);
          }

          function purlFor(type, name, version) {
            const encodedName = type === "npm" ? npmPurlName(name) : encodeURIComponent(name);
            return `pkg:${type}/${encodedName}@${version}`;
          }

          const scopedProbe = purlFor("npm", "@scope/name", "1.2.3");
          const unscopedProbe = purlFor("npm", "plain-name", "2.0.0");
          if (
            scopedProbe !== "pkg:npm/%40scope/name@1.2.3" ||
            unscopedProbe !== "pkg:npm/plain-name@2.0.0" ||
            scopedProbe.includes("%2F")
          ) {
            throw new Error(`npm PURL encoding probe failed: ${scopedProbe}, ${unscopedProbe}`);
          }

          function add(type, name, version) {
            if (!name || !version) return;
            const purl = purlFor(type, name, version);
            components.set(purl, { type: "library", name, version, purl });
          }

          function visitNpm(value, hintedName) {
            if (Array.isArray(value)) {
              for (const item of value) visitNpm(item, hintedName);
              return;
            }
            if (!value || typeof value !== "object") return;
            add("npm", value.name ?? hintedName, value.version);
            for (const [name, dependency] of Object.entries(value.dependencies ?? {})) {
              visitNpm(dependency, name);
            }
          }

          visitNpm(npmRoots);
          for (const packageInfo of cargo.packages ?? []) {
            add("cargo", packageInfo.name, packageInfo.version);
          }
          if (components.size === 0) {
            throw new Error("dependency inventory is empty");
          }

          const bom = {
            bomFormat: "CycloneDX",
            specVersion: "1.5",
            serialNumber: `urn:uuid:${crypto.randomUUID()}`,
            version: 1,
            metadata: {
              timestamp: new Date().toISOString(),
              tools: [
                { vendor: "pnpm", name: "pnpm list", version: "10.33.0" },
                { vendor: "Rust", name: "cargo metadata", version: "1.88.0" },
              ],
            },
            components: [...components.values()].sort((left, right) =>
              left.purl.localeCompare(right.purl),
            ),
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(bom, null, 2)}\n`);
          if (bom.components.length === 0) {
            throw new Error("SBOM has no components");
          }
          NODE
          test -s "$sbom"
          node -e 'const bom = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (bom.bomFormat !== "CycloneDX" || bom.specVersion !== "1.5" || !bom.components.length) process.exit(1)' "$sbom"
          install -m 0644 "$sbom" "$resources/SBOM.cdx.json"
          printf 'SBOM_PATH=%s\n' "$sbom" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate and sign deepest-first
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/deepseek-signing.keychain-db"
          original_default="$RUNNER_TEMP/original-default-keychain.txt"
          original_search="$RUNNER_TEMP/original-search-keychains.txt"
          keychain_password="$(openssl rand -hex 24)"

          restore_keychains() {
            [[ -f "$original_default" && -f "$original_search" ]] || return 0
            local default_keychain
            default_keychain="$(sed -n 's/^[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$original_default")"
            if [[ -n "$default_keychain" ]]; then
              security default-keychain -s "$default_keychain" || true
            fi
            local search_keychains=()
            while IFS= read -r line; do
              line="${line#\"}"
              line="${line%\"}"
              [[ -n "$line" ]] && search_keychains+=("$line")
            done < <(sed -n 's/^[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$original_search")
            if ((${#search_keychains[@]} > 0)); then
              security list-keychains -d user -s "${search_keychains[@]}" || true
            fi
          }

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            restore_keychains
            rm -f "$certificate_path" "$original_default" "$original_search"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security default-keychain -d user > "$original_default"
          security list-keychains -d user > "$original_search"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"

          node_path="$APP_PATH/Contents/Resources/dsh/bin/node"
          node_entitlements="$GITHUB_WORKSPACE/src-tauri/entitlements.plist"
          test -x "$node_path"
          test -s "$node_entitlements"
          mach_o_files="$RUNNER_TEMP/mach-o-files.txt"
          ordered_files="$RUNNER_TEMP/mach-o-files-ordered.txt"
          : > "$mach_o_files"
          while IFS= read -r -d '' path; do
            if file -b "$path" | grep -q 'Mach-O'; then
              printf '%s\n' "$path" >> "$mach_o_files"
            fi
          done < <(find "$APP_PATH/Contents" -type f -print0)
          grep -Fx "$node_path" "$mach_o_files"
          awk -F/ '{ print NF "\t" $0 }' "$mach_o_files" | sort -rn -k1,1 | cut -f2- > "$ordered_files"

          sign_nested() {
            local path="$1"
            if [[ "$path" == "$node_path" ]]; then
              codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --options runtime --entitlements "$node_entitlements" "$path"
            else
              codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --options runtime "$path"
            fi
          }
          while IFS= read -r path; do
            [[ -n "$path" ]] && sign_nested "$path"
          done < "$ordered_files"

          # The outer app is signed only after every nested Mach-O object.
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --options runtime --entitlements "$node_entitlements" "$APP_PATH"

          verify_signature() {
            local path="$1"
            local details
            local authority_line
            local team_line
            codesign --verify --strict --verbose=2 "$path"
            details="$(codesign -dvv "$path" 2>&1)"
            authority_line="$(awk '/^Authority=/{print; exit}' <<< "$details")"
            team_line="$(awk '/^TeamIdentifier=/{print; exit}' <<< "$details")"
            test "$authority_line" = "Authority=$APPLE_SIGNING_IDENTITY"
            test "$team_line" = "TeamIdentifier=$APPLE_TEAM_ID"
          }
          while IFS= read -r path; do
            [[ -n "$path" ]] && verify_signature "$path"
          done < "$ordered_files"
          verify_signature "$APP_PATH"
          codesign -d --entitlements :- "$node_path" 2>/dev/null | grep -F 'com.apple.security.cs.allow-jit'

      - name: Notarize, staple, verify, and prepare app-only artifacts
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -d "$APP_PATH"
          test -s "$SBOM_PATH"
          test -s "$CARGO_LICENSES_PATH"
          test -s "$CARGO_NOTICES_PATH"
          test -s "$APP_PATH/Contents/Resources/Cargo-THIRD-PARTY-LICENSES.json"
          test -s "$APP_PATH/Contents/Resources/Cargo-THIRD-PARTY-NOTICES.txt"
          notarization_zip="$RUNNER_TEMP/${ARTIFACT_STEM}-notarization.zip"
          release_artifact="$RUNNER_TEMP/${ARTIFACT_STEM}.app.zip"
          checksums="$RUNNER_TEMP/${ARTIFACT_STEM}.sha256"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$notarization_zip"
          xcrun notarytool submit "$notarization_zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

          # The release is app-only. Recreate the archive after stapling.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$release_artifact"
          {
            shasum -a 256 "$release_artifact" | awk -v name="$(basename "$release_artifact")" '{ print $1 "  " name }'
            shasum -a 256 "$SBOM_PATH" | awk -v name="$(basename "$SBOM_PATH")" '{ print $1 "  " name }'
            shasum -a 256 "$CARGO_LICENSES_PATH" | awk -v name="$(basename "$CARGO_LICENSES_PATH")" '{ print $1 "  " name }'
            shasum -a 256 "$CARGO_NOTICES_PATH" | awk -v name="$(basename "$CARGO_NOTICES_PATH")" '{ print $1 "  " name }'
          } > "$checksums"
          test -s "$release_artifact"
          test -s "$checksums"
          printf 'RELEASE_ARTIFACT=%s\n' "$release_artifact" >> "$GITHUB_ENV"
          printf 'RELEASE_CHECKSUMS=%s\n' "$checksums" >> "$GITHUB_ENV"

      - name: Publish only verified signed arm64 app artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "$RELEASE_ARTIFACT"
          test -s "$RELEASE_CHECKSUMS"
          test -s "$SBOM_PATH"
          test -s "$CARGO_LICENSES_PATH"
          test -s "$CARGO_NOTICES_PATH"
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_ARTIFACT" \
            "$RELEASE_CHECKSUMS" \
            "$SBOM_PATH" \
            "$CARGO_LICENSES_PATH" \
            "$CARGO_NOTICES_PATH" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

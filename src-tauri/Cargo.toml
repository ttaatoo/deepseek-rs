[package]
name = "deepseek-rs"
version = "0.1.0"
description = "macOS window for the DeepSeek Harness web profile"
authors = ["you"]
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "deepseek_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
